[project]
name = "adm0-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "geoparquet-io>=1.4.0",
    "httpx2[http2]>=2.16.0",
    "pandas[excel]>=3.1.0",
    "portolan-cli>=0.8.0",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "tylertoo>=0.8.0",
]

[dependency-groups]
dev = ["obstore>=0.12.0", "python-dotenv>=1.2.4", "ruff>=0.17.2"]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "INP001", "S603", "S607", "S608"]
